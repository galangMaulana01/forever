<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-neutral-900 font-['Inter',sans-serif] antialiased min-h-screen">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside id="sidebar" class="w-56 shrink-0 border-r border-neutral-200 bg-white flex flex-col fixed h-screen z-20 -translate-x-full lg:translate-x-0 transition-transform">
        <!-- Avatar + welcome -->
        <div class="flex flex-col items-center text-center gap-2 px-4 py-4 border-neutral-200">
          <div id="avatarInitial" class="w-10 h-10 rounded-full bg-teal-500 text-white flex items-center justify-center text-sm font-semibold"></div>
          <p class="text-xs text-neutral-500 leading-snug">Welcome back,<br><span id="statAgentCode" class="text-sm font-semibold text-neutral-900"></span></p>
        </div>
        <nav id="navigationList" class="flex-1 overflow-y-auto py-3 px-2 space-y-0.5 text-sm"></nav>
      </aside>

      <!-- Main -->
      <div class="flex-1 lg:ml-56">
        <header class="h-14 border-b border-neutral-200 flex items-center justify-between px-4 sm:px-6 sticky top-0 bg-white/90 backdrop-blur z-10">
          <div class="flex items-center gap-3">
            <button id="menuToggleButton" class="lg:hidden p-1 text-neutral-500" aria-label="Menu">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </button>
            <div>
              <h1 id="pageTitle" class="text-sm font-semibold text-neutral-900"></h1>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span id="statBalance" class="text-sm font-semibold text-teal-700 tracking-tight"></span>
            <svg width="28" height="20" viewBox="0 0 28 20" class="rounded border border-neutral-200 shrink-0" aria-label="Bendera Indonesia" role="img">
              <rect width="28" height="10" fill="#CE1126"/>
              <rect y="10" width="28" height="10" fill="#FFFFFF"/>
            </svg>
          </div>
        </header>

        <main class="p-4 sm:p-6 max-w-6xl">
          <!-- ================= USERS ================= -->
          <section class="section hidden" data-section="users">
            <div class="flex justify-end mb-3">
              <button id="btnOpenCreateUser" class="bg-teal-500 hover:bg-teal-600 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors" type="button">+ Buat User</button>
            </div>
            <div class="border border-neutral-200 rounded-xl overflow-hidden bg-white">
              <div class="overflow-x-auto">
                <table class="w-full text-sm">
                  <thead>
                    <tr class="bg-neutral-50 border-b border-neutral-200">
                      <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">No</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Nama User</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Balance</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Action</th>
                    </tr>
                  </thead>
                  <tbody id="usersTableBody">
                    <tr><td colspan="4" class="px-4 py-3 text-neutral-400 font-['JetBrains_Mono'] text-xs">memuat...</td></tr>
                  </tbody>
                </table>
              </div>
              <div id="usersPagination" class="border-t border-neutral-200"></div>
            </div>
          </section>

          <!-- ================= GAME LIST ================= -->
          <section class="section hidden" data-section="gamelist">
            <div class="flex flex-wrap items-center gap-3 mb-3">
              <select id="gameListVendorFilter" class="w-full max-w-xs bg-white border border-neutral-300 rounded-lg px-3 py-2 text-sm text-neutral-900 focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400">
                <option value="all">Semua Vendor</option>
              </select>
              <input id="gameListSearch" type="text" placeholder="Cari nama atau kode game..." class="flex-1 min-w-[200px] max-w-xs bg-white border border-neutral-300 rounded-lg px-3 py-2 text-sm text-neutral-900 placeholder:text-neutral-400 focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400">
              <span id="gameListStatus" class="text-xs text-neutral-500"></span>
            </div>
            <div class="border border-neutral-200 rounded-xl overflow-hidden bg-white">
              <div class="overflow-x-auto">
                <table class="w-full text-sm">
                  <thead>
                    <tr class="bg-neutral-50 border-b border-neutral-200">
                      <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">No</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Game Type</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Vendor</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Game Code</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Image</th>
                    </tr>
                  </thead>
                  <tbody id="gameListTableBody">
                    <tr><td colspan="5" class="px-4 py-3 text-neutral-400 font-['JetBrains_Mono'] text-xs">memuat...</td></tr>
                  </tbody>
                </table>
              </div>
              <div id="gameListPagination" class="border-t border-neutral-200"></div>
            </div>
          </section>

          <!-- ================= GAME CONTROL ================= -->
          <section class="section hidden" data-section="gamecontrol">
            <div class="space-y-4">
                <div class="border border-neutral-200 rounded-lg overflow-x-auto">
                  <table class="w-full text-sm">
                    <thead>
                      <tr class="bg-neutral-50 border-b border-neutral-200">
                        <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Waktu</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">User</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Vendor</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Game</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Bet</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Payout</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Balance Sebelum</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Balance Sesudah</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Selesai</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Action</th>
                      </tr>
                    </thead>
                    <tbody id="wagerFeedTableBody">
                      <tr><td colspan="10" class="px-4 py-3 text-neutral-400 font-['JetBrains_Mono'] text-xs">memuat...</td></tr>
                    </tbody>
                  </table>
                </div>
            </div>
          </section>

          <!-- ================= LOG ================= -->
          <section class="section hidden" data-section="log">
            <div class="border border-neutral-200 rounded-xl overflow-hidden bg-white">
              <div class="overflow-x-auto">
                <table class="w-full text-sm">
                  <thead>
                    <tr class="bg-neutral-50 border-b border-neutral-200">
                      <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">No</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Waktu</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Aktivitas</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Status</th>
                      <th class="px-4 py-3 text-left text-xs font-medium text-neutral-500 uppercase tracking-wide whitespace-nowrap">Detail</th>
                    </tr>
                  </thead>
                  <tbody id="logsTableBody">
                    <tr><td colspan="5" class="px-4 py-3 text-neutral-400 font-['JetBrains_Mono'] text-xs">memuat...</td></tr>
                  </tbody>
                </table>
              </div>
              <div id="logsPagination" class="border-t border-neutral-200"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- Modal: Create User -->
    <div id="modalCreateUser" class="fixed inset-0 bg-neutral-900/40 z-50 items-center justify-center p-4 hidden">
      <form id="formCreateUser" class="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-neutral-200 p-6 space-y-3">
        <h3 class="text-sm font-semibold text-neutral-900">Buat User Baru</h3>
        <input class="w-full bg-white border border-neutral-300 rounded-lg px-3 py-2 text-sm text-neutral-900 placeholder:text-neutral-400 focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400" name="userCode" placeholder="Nama / kode user" required>
        <div class="flex justify-end gap-2 pt-1">
          <button type="button" class="border border-neutral-300 text-neutral-700 hover:bg-neutral-50 text-sm font-medium px-4 py-2 rounded-lg transition-colors" data-close-modal="modalCreateUser">Batal</button>
          <button type="submit" class="bg-teal-500 hover:bg-teal-600 text-white text-sm font-medium px-4 py-2 rounded-lg disabled:opacity-50 transition-colors">Simpan</button>
        </div>
      </form>
    </div>

    <!-- Modal: Deposit/Withdraw -->
    <div id="modalUserAction" class="fixed inset-0 bg-neutral-900/40 z-50 items-center justify-center p-4 hidden">
      <form id="formUserAction" class="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-neutral-200 p-6 space-y-3">
        <h3 class="text-sm font-semibold text-neutral-900">Kelola Balance — <span id="userActionUserCode" class="font-['JetBrains_Mono']"></span></h3>
        <div class="flex gap-4 text-sm text-neutral-700">
          <label class="flex items-center gap-1.5"><input type="radio" name="actionType" value="deposit" class="accent-teal-500" checked> Deposit</label>
          <label class="flex items-center gap-1.5"><input type="radio" name="actionType" value="withdraw" class="accent-teal-500"> Withdraw</label>
        </div>
        <input class="w-full bg-white border border-neutral-300 rounded-lg px-3 py-2 text-sm text-neutral-900 placeholder:text-neutral-400 focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400" name="amount" type="number" step="any" min="0" placeholder="amount" required>
        <div class="flex justify-end gap-2 pt-1">
          <button type="button" class="border border-neutral-300 text-neutral-700 hover:bg-neutral-50 text-sm font-medium px-4 py-2 rounded-lg transition-colors" data-close-modal="modalUserAction">Batal</button>
          <button type="submit" class="bg-teal-500 hover:bg-teal-600 text-white text-sm font-medium px-4 py-2 rounded-lg disabled:opacity-50 transition-colors">Simpan</button>
        </div>
      </form>
    </div>

    <!-- Modal: Grant Free Round (Game Live -> Action) -->
    <div id="modalGrantFreeRound" class="fixed inset-0 bg-neutral-900/40 z-50 items-center justify-center p-4 hidden">
      <form id="formGrantFreeRound" class="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-neutral-200 p-6 space-y-3">
        <h3 class="text-sm font-semibold text-neutral-900">Beri Free Round — <span id="grantUserCode" class="font-['JetBrains_Mono']"></span></h3>

        <label class="block space-y-1">
          <span class="text-xs text-neutral-500">Freeround list <span class="text-red-500">*</span></span>
          <select class="w-full bg-white border border-neutral-300 rounded-lg px-3 py-2 text-sm text-neutral-900 focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400" name="betAmount" required>
            <option value="">memuat...</option>
          </select>
        </label>

        <label class="block space-y-1">
          <span class="text-xs text-neutral-500">Freeround count <span class="text-red-500">*</span></span>
          <input class="w-full bg-white border border-neutral-300 rounded-lg px-3 py-2 text-sm text-neutral-900 focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400" name="spinCount" type="number" min="1" step="1" value="10" required>
        </label>

        <label class="block space-y-1">
          <span class="text-xs text-neutral-500">Expire Hours <span class="text-red-500">*</span></span>
          <input class="w-full bg-white border border-neutral-300 rounded-lg px-3 py-2 text-sm text-neutral-900 focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400" name="expireHours" type="number" min="1" step="any" value="24" required>
        </label>

        <p id="grantFreeRoundError" class="text-red-600 text-xs"></p>

        <div class="flex justify-end gap-2 pt-1">
          <button type="button" class="border border-neutral-300 text-neutral-700 hover:bg-neutral-50 text-sm font-medium px-4 py-2 rounded-lg transition-colors" data-close-modal="modalGrantFreeRound">Close</button>
          <button type="submit" class="bg-teal-500 hover:bg-teal-600 text-white text-sm font-medium px-4 py-2 rounded-lg disabled:opacity-50 transition-colors">Apply</button>
        </div>
      </form>
    </div>
<script src="svg.js"></script>
    <script>
      const agentCode = "Keenan";
      const CURRENCY_CODE = "IDR";
      const MONO = "font-['JetBrains_Mono']";

      const NAV_BASE_CLASSES = ["w-full", "text-left", "px-3", "py-2", "rounded-lg", "text-sm", "transition-colors", "border-l-2"];
      const NAV_INACTIVE_CLASSES = ["text-neutral-600", "hover:bg-neutral-50", "hover:text-neutral-900", "border-transparent"];
      const NAV_ACTIVE_CLASSES = ["bg-teal-50", "text-teal-700", "font-medium", "border-teal-400"];

      // Navigasi sidebar (flat, tanpa grouping)
      const navigationSections = [
        { sectionKey: "users", label: "User" },
        { sectionKey: "gamelist", label: "Game List" },
        { sectionKey: "gamecontrol", label: "Game Control" },
        { sectionKey: "log", label: "Log" },
      ];

      const navigationListElement = document.getElementById("navigationList");
      navigationSections.forEach(navigationSection => {
        const navigationButton = document.createElement("button");
        navigationButton.classList.add(...NAV_BASE_CLASSES, ...NAV_INACTIVE_CLASSES);
        navigationButton.textContent = navigationSection.label;
        navigationButton.dataset.sectionKey = navigationSection.sectionKey;
        navigationButton.addEventListener("click", () => showSection(navigationSection.sectionKey));
        navigationListElement.appendChild(navigationButton);
      });

      function showSection(sectionKey) {
        document.querySelectorAll(".section").forEach(sectionElement => {
          sectionElement.classList.toggle("hidden", sectionElement.dataset.section !== sectionKey);
        });
        document.querySelectorAll("#navigationList button").forEach(navigationButton => {
          const isActive = navigationButton.dataset.sectionKey === sectionKey;
          navigationButton.classList.remove(...NAV_INACTIVE_CLASSES, ...NAV_ACTIVE_CLASSES);
          navigationButton.classList.add(...(isActive ? NAV_ACTIVE_CLASSES : NAV_INACTIVE_CLASSES));
        });
        const matchedSection = navigationSections.find(navigationSection => navigationSection.sectionKey === sectionKey);
        document.getElementById("pageTitle").textContent = matchedSection.label;
        if (window.innerWidth < 1024) {
          document.getElementById("sidebar").classList.add("-translate-x-full");
        }

        if (sectionKey === "users") loadUsers();
        if (sectionKey === "gamelist") loadAllGames();
        if (sectionKey === "log") loadLogs();
        // Live wager feed otomatis jalan/berhenti sesuai section aktif (hemat rate-limit vendor)
        if (sectionKey === "gamecontrol") startWagerFeed(); else stopWagerFeed();
      }

      document.getElementById("menuToggleButton").addEventListener("click", () => {
        document.getElementById("sidebar").classList.toggle("-translate-x-full");
      });

      async function callCasino(methodName, requestParameters = {}) {
        return await callBackend("/casino", "POST", { method: methodName, ...requestParameters });
      }

      async function callBackend(endpoint, method = "GET", body = null) {
        const config = {
          method: method,
          headers: { "Content-Type": "application/json" }
        };
        if (body !== null) {
          config.body = JSON.stringify(body);
        }
        const response = await fetch(endpoint, config);
        if (!response.ok) {
          let errorText = await response.text();
          try {
            const errorJson = JSON.parse(errorText);
            throw new Error(errorJson.detail || errorJson.message || errorText);
          } catch (_) {
            throw new Error(`HTTP ${response.status}: ${errorText}`);
          }
        }
        return await response.json();
      }

      function openModal(modalId) {
        const modal = document.getElementById(modalId);
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      }

      function closeModal(modalId) {
        const modal = document.getElementById(modalId);
        modal.classList.remove("flex");
        modal.classList.add("hidden");
      }
      document.querySelectorAll("[data-close-modal]").forEach(button => {
        button.addEventListener("click", () => closeModal(button.dataset.closeModal));
      });

      function escapeHtml(text) {
        return String(text ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char]));
      }

      function formatDateTime(value) {
        if (!value) return "-";
        const date = new Date(value);
        if (isNaN(date.getTime())) return String(value);
        return date.toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });
      }

      function badgeHtml(text, variant) {
        const variants = {
          success: "bg-emerald-50 text-emerald-700",
          warning: "bg-amber-50 text-amber-700",
          error: "bg-red-50 text-red-700",
          neutral: "bg-neutral-100 text-neutral-600",
          accent: "bg-teal-50 text-teal-700",
        };
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${variants[variant] || variants.neutral}">${escapeHtml(text)}</span>`;
      }

      function emptyStateHtml(message) {
        return `
          <div class="flex flex-col items-center justify-center gap-3 py-12 text-center">
            <svg viewBox="0 0 64 64" fill="none" class="w-14 h-14 text-neutral-300" aria-hidden="true">
              <rect x="8" y="20" width="48" height="28" rx="14" stroke="currentColor" stroke-width="3"/>
              <path d="M20 30v8M16 34h8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              <circle cx="44" cy="30" r="2.5" fill="currentColor"/>
              <circle cx="38" cy="36" r="2.5" fill="currentColor"/>
              <circle cx="50" cy="36" r="2.5" fill="currentColor"/>
            </svg>
            <p class="text-sm text-neutral-500">${escapeHtml(message)}</p>
          </div>
        `;
      }

      const PAGE_SIZE = 25;
      const paginationState = { users: 1, gameList: 1, logs: 1 };

      function paginate(items, key) {
        const total = items.length;
        const pageCount = Math.max(1, Math.ceil(total / PAGE_SIZE));
        paginationState[key] = Math.min(Math.max(1, paginationState[key]), pageCount);
        const page = paginationState[key];
        const start = (page - 1) * PAGE_SIZE;
        return { pageItems: items.slice(start, start + PAGE_SIZE), page, pageCount, total, start };
      }

      function renderPagination(containerId, key, total, onChange) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const pageCount = Math.max(1, Math.ceil(total / PAGE_SIZE));
        const page = paginationState[key];
        if (total <= PAGE_SIZE) {
          container.innerHTML = `<div class="flex items-center justify-end px-4 py-2 text-xs text-neutral-500">Total: ${total}</div>`;
          return;
        }
        const from = (page - 1) * PAGE_SIZE + 1;
        const to = Math.min(page * PAGE_SIZE, total);
        const navBtn = "border border-neutral-300 text-neutral-700 hover:bg-neutral-50 disabled:opacity-40 disabled:cursor-not-allowed text-xs font-medium px-3 py-1.5 rounded-lg transition-colors";
        container.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-2 text-xs">
            <div class="text-neutral-500">Menampilkan ${from}-${to} dari ${total}</div>
            <div class="flex items-center gap-2">
              <button class="${navBtn}" ${page === 1 ? "disabled" : ""} data-page="prev">Sebelumnya</button>
              <span class="text-neutral-500">Halaman ${page} / ${pageCount}</span>
              <button class="${navBtn}" ${page === pageCount ? "disabled" : ""} data-page="next">Berikutnya</button>
            </div>
          </div>
        `;
        container.querySelectorAll("[data-page]").forEach(button => {
          button.addEventListener("click", () => {
            if (button.disabled) return;
            paginationState[key] = button.dataset.page === "prev" ? page - 1 : page + 1;
            onChange();
          });
        });
      }

      // ================= USERS =================
      let loadedUsers = [];
      const outlineActionBtn = "border border-neutral-300 text-neutral-700 hover:bg-neutral-50 text-xs font-medium px-3 py-1.5 rounded-lg transition-colors";
      const solidActionBtnSmall = "bg-teal-500 hover:bg-teal-600 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition-colors";

      function renderUsersTable() {
        const tbody = document.getElementById("usersTableBody");
        if (!loadedUsers.length) {
          tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-3 text-neutral-400 ${MONO} text-xs">belum ada user</td></tr>`;
          renderPagination("usersPagination", "users", 0, renderUsersTable);
          return;
        }
        const { pageItems, start } = paginate(loadedUsers, "users");
        tbody.innerHTML = pageItems.map((user, index) => `
          <tr class="border-t border-neutral-100 hover:bg-neutral-50">
            <td class="px-4 py-3 text-neutral-500">${start + index + 1}</td>
            <td class="px-4 py-3 text-neutral-900">${escapeHtml(user.user_code)}</td>
            <td class="px-4 py-3 ${MONO} text-neutral-900">${escapeHtml(user.total_balance ?? 0)}</td>
            <td class="px-4 py-3"><button class="${outlineActionBtn}" data-user-action="${escapeHtml(user.user_code)}">Deposit/Withdraw</button></td>
          </tr>
        `).join("");
        tbody.querySelectorAll("[data-user-action]").forEach(button => {
          button.addEventListener("click", () => {
            const userCode = button.dataset.userAction;
            document.getElementById("userActionUserCode").textContent = userCode;
            const form = document.getElementById("formUserAction");
            form.dataset.userCode = userCode;
            form.reset();
            openModal("modalUserAction");
          });
        });
        renderPagination("usersPagination", "users", loadedUsers.length, renderUsersTable);
      }

      async function loadUsers() {
        const tbody = document.getElementById("usersTableBody");
        tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-3 text-neutral-400 ${MONO} text-xs">memuat...</td></tr>`;
        document.getElementById("usersPagination").innerHTML = "";
        try {
          loadedUsers = await callBackend("/users", "GET");
          renderUsersTable();
        } catch (error) {
          tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-3 text-red-600 ${MONO} text-xs">ERROR: ${escapeHtml(error.message)}</td></tr>`;
        }
      }

      document.getElementById("btnOpenCreateUser").addEventListener("click", () => {
        document.getElementById("formCreateUser").reset();
        openModal("modalCreateUser");
      });

      document.getElementById("formCreateUser").addEventListener("submit", async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const submitButton = form.querySelector("button[type=submit]");
        const userCodeInput = form.querySelector('input[name="userCode"]');
        const userCode = (userCodeInput?.value || "").trim();
        if (!userCode) {
          alert("Nama user tidak boleh kosong.");
          return;
        }
        submitButton.disabled = true;
        try {
          await callBackend("/users", "POST", { user_code: userCode });
          form.reset();
          closeModal("modalCreateUser");
          await loadUsers();
        } catch (error) {
          console.error("Create user failed", error);
          alert("Gagal membuat user: " + error.message);
        } finally {
          submitButton.disabled = false;
        }
      });

      document.getElementById("formUserAction").addEventListener("submit", async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const submitButton = form.querySelector("button[type=submit]");
        const userCode = form.dataset.userCode;
        const checkedAction = form.querySelector('input[name="actionType"]:checked');
        const action = checkedAction?.value;
        const amountInput = form.querySelector('input[name="amount"]');
        const amount = Number(amountInput?.value);
        if (!userCode) { alert("User tidak ditemukan, tutup lalu buka lagi."); return; }
        if (action !== "deposit" && action !== "withdraw") { alert("Pilih Deposit atau Withdraw."); return; }
        if (!Number.isFinite(amount) || amount <= 0) { alert("Amount harus lebih dari 0."); return; }
        submitButton.disabled = true;
        try {
          await callBackend(`/users/${encodeURIComponent(userCode)}/${action}`, "POST", { amount });
          form.reset();
          closeModal("modalUserAction");
          await loadUsers();
        } catch (error) {
          console.error(`${action} failed`, error);
          alert(`Gagal ${action}: ` + error.message);
        } finally {
          submitButton.disabled = false;
        }
      });

      // ================= GAME LIST =================
      function parseLocalizedField(value, fallback) {
        if (!value) return fallback;
        try {
          const parsed = JSON.parse(value);
          return parsed.en || Object.values(parsed)[0] || fallback;
        } catch (_) {
          return value;
        }
      }

      const GAME_TYPE_LABELS = { 1: "Slot", 2: "Live Casino" };
      const gameTypeLabel = type => GAME_TYPE_LABELS[type] || `Type ${type}`;

      let loadedGames = [];
      let gameListLoaded = false;
      let gameListLoading = false;

      function rebuildVendorFilterOptions() {
        const vendorSelect = document.getElementById("gameListVendorFilter");
        const currentVendor = vendorSelect.value || "all";

        const vendorsMap = new Map();
        loadedGames.forEach(game => {
          if (!vendorsMap.has(game.vendorCode)) vendorsMap.set(game.vendorCode, game.vendorName);
        });
        const vendorOptions = Array.from(vendorsMap.entries()).sort((a, b) => a[1].localeCompare(b[1]));
        vendorSelect.innerHTML = `<option value="all">Semua Vendor</option>` + vendorOptions.map(([code, name]) =>
          `<option value="${escapeHtml(code)}">${escapeHtml(name)}</option>`
        ).join("");
        vendorSelect.value = vendorsMap.has(currentVendor) || currentVendor === "all" ? currentVendor : "all";
      }

      function getFilteredGames() {
        const vendorFilter = document.getElementById("gameListVendorFilter").value;
        const searchTerm = document.getElementById("gameListSearch").value.trim().toLowerCase();
        return loadedGames.filter(game => {
          if (vendorFilter !== "all" && game.vendorCode !== vendorFilter) return false;
          if (searchTerm) {
            const name = parseLocalizedField(game.gameName, game.gameCode).toLowerCase();
            const code = String(game.gameCode || "").toLowerCase();
            if (!name.includes(searchTerm) && !code.includes(searchTerm)) return false;
          }
          return true;
        });
      }

      function renderGameListTable() {
        const tbody = document.getElementById("gameListTableBody");
        const filtered = getFilteredGames();
        if (!filtered.length) {
          tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-3 text-neutral-400 ${MONO} text-xs">tidak ada game untuk filter ini</td></tr>`;
          renderPagination("gameListPagination", "gameList", 0, renderGameListTable);
          return;
        }
        const { pageItems, start } = paginate(filtered, "gameList");
        tbody.innerHTML = pageItems.map((game, index) => `
          <tr class="border-t border-neutral-100 hover:bg-neutral-50">
            <td class="px-4 py-3 ${MONO} text-xs text-neutral-400">${start + index + 1}</td>
            <td class="px-4 py-3">${badgeHtml(gameTypeLabel(game.gameType), "accent")}</td>
            <td class="px-4 py-3">
              <div class="text-neutral-900">${escapeHtml(game.vendorName)}</div>
              <div class="${MONO} text-xs text-neutral-400">${escapeHtml(game.vendorCode)}</div>
            </td>
            <td class="px-4 py-3">
              <div class="text-neutral-900">${escapeHtml(parseLocalizedField(game.gameName, game.gameCode))}</div>
              <div class="${MONO} text-xs text-neutral-400">${escapeHtml(game.gameCode)}</div>
            </td>
            <td class="px-4 py-3"><img class="w-12 h-12 rounded-lg object-cover bg-neutral-100 border border-neutral-200" src="${escapeHtml(parseLocalizedField(game.imageUrl, ""))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></td>
          </tr>
        `).join("");
        renderPagination("gameListPagination", "gameList", filtered.length, renderGameListTable);
      }

      async function loadAllGames(force = false) {
        if (gameListLoading) return;
        if (gameListLoaded && !force) return;
        gameListLoading = true;
        const tbody = document.getElementById("gameListTableBody");
        const status = document.getElementById("gameListStatus");
        tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-3 text-neutral-400 ${MONO} text-xs">memuat vendor...</td></tr>`;
        status.textContent = "";
        try {
          const vendorResponse = await callBackend("/vendors", "GET");
          const vendors = vendorResponse.vendors || [];
          status.textContent = `memuat game dari ${vendors.length} vendor...`;
          const perVendor = await Promise.all(vendors.map(async vendor => {
            const vendorName = parseLocalizedField(vendor.vendorName, vendor.vendorCode);
            try {
              const gamesResponse = await callBackend(`/games?vendor=${encodeURIComponent(vendor.vendorCode)}`, "GET");
              return (gamesResponse.vendorGames || []).map(game => ({
                ...game,
                vendorCode: vendor.vendorCode,
                vendorName,
              }));
            } catch (_) {
              return [];
            }
          }));
          loadedGames = perVendor.flat();
          gameListLoaded = true;
          paginationState.gameList = 1;
          rebuildVendorFilterOptions();
          renderGameListTable();
          status.textContent = `${loadedGames.length} game dari ${vendors.length} vendor`;
        } catch (error) {
          tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-3 text-red-600 ${MONO} text-xs">ERROR: ${escapeHtml(error.message)}</td></tr>`;
          status.textContent = "";
        } finally {
          gameListLoading = false;
        }
      }

      document.getElementById("gameListVendorFilter").addEventListener("change", () => { paginationState.gameList = 1; renderGameListTable(); });
      document.getElementById("gameListSearch").addEventListener("input", () => { paginationState.gameList = 1; renderGameListTable(); });

      let wagerFeedIntervalId = null;
      const wagerFeedSeen = new Map();

      function setWagerFeedStatus(text, variant) {
        const el = document.getElementById("wagerFeedStatus");
        const variants = {
          live: "bg-emerald-50 text-emerald-700",
          stopped: "bg-neutral-100 text-neutral-500",
          error: "bg-red-50 text-red-700",
        };
        el.className = `inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${variants[variant] || variants.stopped}`;
        el.textContent = text;
      }

      function toCasinoDateTime(date) {
        const pad = n => String(n).padStart(2, "0");
        return `${date.getUTCFullYear()}-${pad(date.getUTCMonth() + 1)}-${pad(date.getUTCDate())} ${pad(date.getUTCHours())}:${pad(date.getUTCMinutes())}:${pad(date.getUTCSeconds())}`;
      }

      function renderWagerFeedTable() {
        const tbody = document.getElementById("wagerFeedTableBody");
        const wagers = Array.from(wagerFeedSeen.values())
          .sort((a, b) => new Date(b.createdOn) - new Date(a.createdOn))
          .slice(0, 100);
        if (!wagers.length) {
          tbody.innerHTML = `<tr><td colspan="10">${emptyStateHtml("Tidak ada yang bermain sekarang")}</td></tr>`;
          return;
        }
        tbody.innerHTML = wagers.map(wager => `
          <tr class="border-t border-neutral-100 hover:bg-neutral-50">
            <td class="px-4 py-3 ${MONO} text-xs text-neutral-500">${escapeHtml(wager.createdOn)}</td>
            <td class="px-4 py-3 text-neutral-900">${escapeHtml(wager.userCode)}</td>
            <td class="px-4 py-3 ${MONO} text-xs text-neutral-500">${escapeHtml(wager.vendorCode)}</td>
            <td class="px-4 py-3 ${MONO} text-xs text-neutral-500">${escapeHtml(wager.gameCode)}</td>
            <td class="px-4 py-3 ${MONO} text-neutral-900">${escapeHtml(wager.betAmount)}</td>
            <td class="px-4 py-3 ${MONO} text-neutral-900">${escapeHtml(wager.payoutAmount)}</td>
            <td class="px-4 py-3 ${MONO} text-xs text-neutral-400">${escapeHtml(wager.beforeBalance)}</td>
            <td class="px-4 py-3 ${MONO} text-xs text-neutral-400">${escapeHtml(wager.afterBalance)}</td>
            <td class="px-4 py-3">${wager.isFinished ? badgeHtml("Selesai", "success") : badgeHtml("Berjalan", "warning")}</td>
            <td class="px-4 py-3"><button class="${solidActionBtnSmall}" data-grant="${escapeHtml(wager.userCode)}" data-vendor="${escapeHtml(wager.vendorCode)}" data-game="${escapeHtml(wager.gameCode)}">Action</button></td>
          </tr>
        `).join("");
        tbody.querySelectorAll("[data-grant]").forEach(button => {
          button.addEventListener("click", () => openGrantFreeRoundModal(button.dataset.grant, button.dataset.vendor, button.dataset.game));
        });
      }

      async function pollWagerFeed() {
        const now = new Date();
        const start = new Date(now.getTime() - 4 * 60 * 1000);
        try {
          const response = await callCasino("ReportByDate", {
            startDate: toCasinoDateTime(start),
            endDate: toCasinoDateTime(now)
          });
          (response.wagers || []).forEach(wager => wagerFeedSeen.set(wager.wagerId, wager));
          renderWagerFeedTable();
          setWagerFeedStatus("live", "live");
        } catch (error) {
          setWagerFeedStatus("error: " + error.message, "error");
        }
      }

      function startWagerFeed() {
        if (wagerFeedIntervalId) return;
        pollWagerFeed();
        wagerFeedIntervalId = setInterval(pollWagerFeed, 5000);
        setWagerFeedStatus("live", "live");
      }

      function stopWagerFeed() {
        if (!wagerFeedIntervalId) return;
        clearInterval(wagerFeedIntervalId);
        wagerFeedIntervalId = null;
        setWagerFeedStatus("berhenti", "stopped");
      }

      async function openGrantFreeRoundModal(userCode, vendorCode, gameCode) {
        const form = document.getElementById("formGrantFreeRound");
        form.reset();
        form.dataset.userCode = userCode;
        form.dataset.vendorCode = vendorCode;
        form.dataset.gameCode = gameCode;
        document.getElementById("grantUserCode").textContent = userCode;
        document.getElementById("grantFreeRoundError").textContent = "";

        const betSelect = form.querySelector('select[name="betAmount"]');
        const submitButton = form.querySelector("button[type=submit]");
        betSelect.innerHTML = `<option value="">memuat...</option>`;
        submitButton.disabled = true;
        openModal("modalGrantFreeRound");

        try {
          const response = await callCasino("GetFreeRoundList", { vendorCode, gameCode });
          const freeRounds = response.freeRounds || [];
          if (!freeRounds.length) {
            betSelect.innerHTML = `<option value="">tidak tersedia</option>`;
            document.getElementById("grantFreeRoundError").textContent = "Game ini tidak mendukung Free Round.";
            return;
          }
          betSelect.innerHTML = freeRounds.map(amount => `<option value="${amount}">${amount}${CURRENCY_CODE}</option>`).join("");
          submitButton.disabled = false;
        } catch (error) {
          betSelect.innerHTML = `<option value="">gagal memuat</option>`;
          document.getElementById("grantFreeRoundError").textContent = "Gagal memuat Freeround list: " + error.message;
        }
      }

      document.getElementById("formGrantFreeRound").addEventListener("submit", async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const submitButton = form.querySelector("button[type=submit]");
        const betAmount = Number(form.querySelector('select[name="betAmount"]').value);
        const spinCount = Number(form.querySelector('input[name="spinCount"]').value);
        const expireHours = Number(form.querySelector('input[name="expireHours"]').value);
        const errorEl = document.getElementById("grantFreeRoundError");
        errorEl.textContent = "";
        if (!betAmount) { errorEl.textContent = "Pilih Freeround list dulu."; return; }
        if (!Number.isFinite(spinCount) || spinCount <= 0) { errorEl.textContent = "Freeround count harus lebih dari 0."; return; }
        if (!Number.isFinite(expireHours) || expireHours <= 0) { errorEl.textContent = "Expire Hours harus lebih dari 0."; return; }

        const params = { userCode: form.dataset.userCode, vendorCode: form.dataset.vendorCode, gameCode: form.dataset.gameCode };
        submitButton.disabled = true;
        try {
          await callCasino("CancelFreeRound", params).catch(() => {});

          await callCasino("ApplyFreeRound", { ...params, betAmount, spinCount, expireHours });
          closeModal("modalGrantFreeRound");
          alert(`Free round diberikan ke ${form.dataset.userCode}: ${betAmount}${CURRENCY_CODE} x ${spinCount} spin (expire ${expireHours} jam).`);
        } catch (error) {
          errorEl.textContent = "Gagal: " + error.message;
        } finally {
          submitButton.disabled = false;
        }
      });

      let loadedLogs = [];
      const LOG_ACTION_VARIANT = {
        CreateUser: "accent",
        Deposit: "success",
        Withdraw: "warning",
        ApplyFreeRound: "accent",
        CancelFreeRound: "neutral",
      };

      function formatLogDetail(log) {
        const detail = log.detail || {};
        const result = log.result || {};
        const parts = [];
        if (detail.userCode) parts.push(`user: ${detail.userCode}`);
        if (detail.amount !== undefined) parts.push(`amount: ${detail.amount}`);
        if (detail.vendorCode) parts.push(`vendor: ${detail.vendorCode}`);
        if (detail.gameCode) parts.push(`game: ${detail.gameCode}`);
        if (detail.betAmount !== undefined) parts.push(`bet: ${detail.betAmount}`);
        if (detail.spinCount !== undefined) parts.push(`spin: ${detail.spinCount}`);
        if (result.balance !== undefined) parts.push(`balance: ${result.balance}`);
        if (result.msg) parts.push(`(${result.msg})`);
        return parts.join(", ") || "-";
      }

      function renderLogsTable() {
        const tbody = document.getElementById("logsTableBody");
        if (!loadedLogs.length) {
          tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-3 text-neutral-400 ${MONO} text-xs">belum ada aktivitas</td></tr>`;
          renderPagination("logsPagination", "logs", 0, renderLogsTable);
          return;
        }
        const { pageItems, start } = paginate(loadedLogs, "logs");
        tbody.innerHTML = pageItems.map((log, index) => {
          const succeeded = log.result?.status === 0;
          const statusBadge = badgeHtml(succeeded ? "Sukses" : "Gagal", succeeded ? "success" : "error");
          return `
            <tr class="border-t border-neutral-100 hover:bg-neutral-50">
              <td class="px-4 py-3 text-neutral-500">${start + index + 1}</td>
              <td class="px-4 py-3 text-xs text-neutral-500">${formatDateTime(log.created_at)}</td>
              <td class="px-4 py-3">${badgeHtml(log.action, LOG_ACTION_VARIANT[log.action] || "neutral")}</td>
              <td class="px-4 py-3">${statusBadge}</td>
              <td class="px-4 py-3 ${MONO} text-xs text-neutral-600">${escapeHtml(formatLogDetail(log))}</td>
            </tr>
          `;
        }).join("");
        renderPagination("logsPagination", "logs", loadedLogs.length, renderLogsTable);
      }

      async function loadLogs() {
        const tbody = document.getElementById("logsTableBody");
        tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-3 text-neutral-400 ${MONO} text-xs">memuat...</td></tr>`;
        document.getElementById("logsPagination").innerHTML = "";
        try {
          loadedLogs = await callBackend("/logs", "GET");
          renderLogsTable();
        } catch (error) {
          tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-3 text-red-600 ${MONO} text-xs">ERROR: ${escapeHtml(error.message)}</td></tr>`;
        }
      }

      async function loadAgentInfo() {
        const agentCodeStatElement = document.getElementById("statAgentCode");
        const balanceStatElement = document.getElementById("statBalance");
        const avatarElement = document.getElementById("avatarInitial");

        agentCodeStatElement.textContent = agentCode;
        avatarElement.textContent = agentCode.charAt(0).toUpperCase();
        balanceStatElement.classList.add("animate-pulse");
        balanceStatElement.textContent = "memuat...";

        try {
          const responseData = await callCasino("GetAgentInfo", {});

          const balancesMap = responseData.balances || responseData.balance;
          if (balancesMap && typeof balancesMap === "object") {
            const balanceValue = balancesMap.IDR ?? Object.values(balancesMap)[0];
            balanceStatElement.textContent = "IDR " + balanceValue;
          } else {
            balanceStatElement.textContent = responseData.msg || "Error";
          }
        } catch (error) {
          balanceStatElement.textContent = "Gagal konek";
        } finally {
          balanceStatElement.classList.remove("animate-pulse");
        }
      }

      showSection(navigationSections[0].sectionKey);
      loadAgentInfo();
    </script>
  </body>
</html>
