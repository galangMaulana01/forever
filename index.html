<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      html { color-scheme: dark; }
      body { font-family: 'Inter', sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
      .skeleton { background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.09) 37%, rgba(255,255,255,.04) 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; }
      @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
      @media (prefers-reduced-motion: reduce) { .skeleton { animation: none !important; } }
      .section { display: none; }
      .section.active { display: block; }
      .nav-item.active { background: rgba(255,255,255,.06); color: #fff; }
      .f-input { width: 100%; background: transparent; border: 1px solid #262626; border-radius: .5rem; padding: .5rem .75rem; font-size: .8125rem; color: inherit; }
      .f-input:focus { outline: 2px solid #3b82f6; outline-offset: 1px; }
      .btn-run { font-size: .75rem; padding: .5rem 1rem; border-radius: .5rem; background: #f5f5f5; color: #0a0a0a; font-weight: 500; }
      .btn-run:hover { background: #fff; }
      .btn-run:disabled { opacity: .5; }
    </style>
  </head>
  <body class="bg-neutral-950 text-neutral-300 min-h-screen">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside id="sidebar" class="w-56 shrink-0 border-r border-neutral-800 bg-neutral-950 flex flex-col fixed h-screen z-20 -translate-x-full lg:translate-x-0 transition-transform">
        <div class="flex flex-col items-start justify-center gap-0.5 px-4 py-3 border-b border-neutral-800">
          <span id="statAgentCode" class="text-sm font-semibold text-neutral-100 tracking-tight"></span>
          <span id="statBalance" class="text-xs font-semibold text-neutral-50 tracking-tight"></span>
        </div>
        <nav id="navigationList" class="flex-1 overflow-y-auto py-3 px-2 space-y-0.5 text-sm"></nav>
      </aside>

      <!-- Main -->
      <div class="flex-1 lg:ml-56">
        <header class="h-14 border-b border-neutral-800 flex items-center justify-between px-4 sm:px-6 sticky top-0 bg-neutral-950/90 backdrop-blur z-10">
          <div class="flex items-center gap-3">
            <button id="menuToggleButton" class="lg:hidden p-1 text-neutral-400" aria-label="Menu">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </button>
            <div>
              <h1 id="pageTitle" class="text-sm font-semibold text-neutral-100"></h1>
            </div>
          </div>
        </header>

        <main class="p-4 sm:p-6 max-w-5xl">
          <!-- ================= USERS ================= -->
          <section class="section" data-section="users">
            <div class="grid lg:grid-cols-2 gap-4">
              <form class="border border-neutral-800 rounded-xl p-4 space-y-2" data-endpoint="CreateUser" data-out="out-users">
                <h3 class="text-sm font-medium text-neutral-200">Create User</h3>
                <input class="f-input" name="userCode" placeholder="userCode" required>
                <button class="btn-run" type="submit">Jalankan</button>
              </form>

              <form class="border border-neutral-800 rounded-xl p-4 space-y-2" data-endpoint="ListUsers" data-out="out-users">
                <h3 class="text-sm font-medium text-neutral-200">List Users</h3>
                <button class="btn-run" type="submit">Jalankan</button>
              </form>
            </div>
            <div class="mt-4 border border-neutral-800 rounded-xl">
              <div class="px-4 py-3 border-b border-neutral-800"><h2 class="text-sm font-medium text-neutral-200">Respons</h2></div>
              <div class="p-4"><pre id="out-users" class="mono text-xs text-neutral-500 whitespace-pre-wrap break-all min-h-[2.5rem]">belum ada request</pre></div>
            </div>
          </section>

          <!-- ================= GAMES ================= -->
          <section class="section" data-section="games">
            <div class="grid lg:grid-cols-2 gap-4">
              <form class="border border-neutral-800 rounded-xl p-4 space-y-2" data-endpoint="GetVendors" data-out="out-games">
                <h3 class="text-sm font-medium text-neutral-200">Get Vendor List</h3>
                <button class="btn-run" type="submit">Jalankan</button>
              </form>

              <form class="border border-neutral-800 rounded-xl p-4 space-y-2" data-endpoint="GetVendorGames" data-out="out-games">
                <h3 class="text-sm font-medium text-neutral-200">Get Game List</h3>
                <input class="f-input" name="vendorCode" placeholder="vendorCode" required>
                <button class="btn-run" type="submit">Jalankan</button>
              </form>

              <form class="border border-neutral-800 rounded-xl p-4 space-y-2 lg:col-span-2" data-endpoint="LaunchGame" data-out="out-games">
                <h3 class="text-sm font-medium text-neutral-200">Launch Game Session</h3>
                <div class="grid sm:grid-cols-3 gap-2">
                  <input class="f-input" name="userCode" placeholder="userCode" required>
                  <input class="f-input" name="vendorCode" placeholder="vendorCode" required>
                  <input class="f-input" name="gameCode" placeholder="gameCode" required>
                </div>
                <button class="btn-run" type="submit">Jalankan</button>
              </form>
            </div>
            <div class="mt-4 border border-neutral-800 rounded-xl">
              <div class="px-4 py-3 border-b border-neutral-800"><h2 class="text-sm font-medium text-neutral-200">Respons</h2></div>
              <div class="p-4"><pre id="out-games" class="mono text-xs text-neutral-500 whitespace-pre-wrap break-all min-h-[2.5rem]">belum ada request</pre></div>
            </div>
          </section>

          <!-- ================= FREE ROUND (Casino API) ================= -->
          <section class="section" data-section="freeround">
            <div class="grid lg:grid-cols-2 gap-4">
              <form class="border border-neutral-800 rounded-xl p-4 space-y-2" data-endpoint="GetFreeRoundList" data-out="out-freeround">
                <h3 class="text-sm font-medium text-neutral-200">Get Free Round List</h3>
                <input class="f-input" name="vendorCode" placeholder="vendorCode" required>
                <input class="f-input" name="gameCode" placeholder="gameCode" required>
                <button class="btn-run" type="submit">Jalankan</button>
              </form>

              <div class="hidden lg:block"></div>

              <form class="border border-neutral-800 rounded-xl p-4 space-y-2" data-endpoint="ApplyFreeRound" data-out="out-freeround">
                <h3 class="text-sm font-medium text-neutral-200">Apply Free Round</h3>
                <input class="f-input" name="userCode" placeholder="userCode" required>
                <input class="f-input" name="vendorCode" placeholder="vendorCode" required>
                <input class="f-input" name="gameCode" placeholder="gameCode" required>
                <input class="f-input" name="betAmount" type="number" step="any" placeholder="betAmount" required>
                <input class="f-input" name="spinCount" type="number" placeholder="spinCount" required>
                <input class="f-input" name="expireHours" type="number" step="any" placeholder="expireHours" required>
                <button class="btn-run" type="submit">Jalankan</button>
              </form>

              <form class="border border-neutral-800 rounded-xl p-4 space-y-2" data-endpoint="CancelFreeRound" data-out="out-freeround">
                <h3 class="text-sm font-medium text-neutral-200">Cancel Free Round</h3>
                <input class="f-input" name="userCode" placeholder="userCode" required>
                <input class="f-input" name="vendorCode" placeholder="vendorCode" required>
                <input class="f-input" name="gameCode" placeholder="gameCode" required>
                <button class="btn-run" type="submit">Jalankan</button>
              </form>
            </div>
            <div class="mt-4 border border-neutral-800 rounded-xl">
              <div class="px-4 py-3 border-b border-neutral-800"><h2 class="text-sm font-medium text-neutral-200">Respons</h2></div>
              <div class="p-4"><pre id="out-freeround" class="mono text-xs text-neutral-500 whitespace-pre-wrap break-all min-h-[2.5rem]">belum ada request</pre></div>
            </div>
          </section>

          <!-- ================= LAUNCH HISTORY MANAGEMENT (Backend) ================= -->
          <section class="section" data-section="launch-history">
            <div class="grid lg:grid-cols-2 gap-4">
              <!-- We only keep the Delete form because the backend does not provide a GET list endpoint -->
              <form class="border border-neutral-800 rounded-xl p-4 space-y-2" data-endpoint="DeleteLaunchHistory" data-out="out-launch-history">
                <h3 class="text-sm font-medium text-neutral-200">Delete Launch History (for testing)</h3>
                <input class="f-input" name="id" placeholder="id" required>
                <button class="btn-run" type="submit">Jalankan</button>
              </form>
            </div>
            <div class="mt-4 border border-neutral-800 rounded-xl">
              <div class="px-4 py-3 border-b border-neutral-800"><h2 class="text-sm font-medium text-neutral-200">Respons</h2></div>
              <div class="p-4"><pre id="out-launch-history" class="mono text-xs text-neutral-500 whitespace-pre-wrap break-all min-h-[2.5rem]">belum ada request</pre></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script>
      const apiToken = "7a7679686270667765787036746e6635";
      const agentCode = "Keenan";
      const apiBaseUrl = "https://api.aicvgdbi.win/api/casinoapi";

      // Navigasi sidebar
      const navigationSections = [
        { sectionKey: "users", label: "User Management" },
        { sectionKey: "games", label: "Game & Provider" },
        { sectionKey: "freeround", label: "Free Round" },
        { sectionKey: "launch-history", label: "Launch History (Delete)" },
      ];

      const navigationListElement = document.getElementById("navigationList");
      navigationSections.forEach(navigationSection => {
        const navigationButton = document.createElement("button");
        navigationButton.className = "nav-item w-full text-left px-3 py-2 rounded-lg text-neutral-400 hover:text-neutral-100 transition-colors";
        navigationButton.textContent = navigationSection.label;
        navigationButton.dataset.sectionKey = navigationSection.sectionKey;
        navigationButton.addEventListener("click", () => showSection(navigationSection.sectionKey));
        navigationListElement.appendChild(navigationButton);
      });

      function showSection(sectionKey) {
        document.querySelectorAll(".section").forEach(sectionElement => {
          sectionElement.classList.toggle("active", sectionElement.dataset.section === sectionKey);
        });
        document.querySelectorAll(".nav-item").forEach(navigationButton => {
          navigationButton.classList.toggle("active", navigationButton.dataset.sectionKey === sectionKey);
        });
        const matchedSection = navigationSections.find(navigationSection => navigationSection.sectionKey === sectionKey);
        document.getElementById("pageTitle").textContent = matchedSection.label;
        if (window.innerWidth < 1024) {
          document.getElementById("sidebar").classList.add("-translate-x-full");
        }
      }
      // halaman pertama yang tampil pas dibuka = item pertama di navigationSections
      showSection(navigationSections[0].sectionKey);

      document.getElementById("menuToggleButton").addEventListener("click", () => {
        document.getElementById("sidebar").classList.toggle("-translate-x-full");
      });

      // Pemanggilan Casino API
      async function callCasino(methodName, requestParameters = {}) {
        const requestBody = { method: methodName, token: apiToken, agentCode: agentCode, ...requestParameters };
        Object.keys(requestBody).forEach(parameterName => {
          if (requestBody[parameterName] === "" || requestBody[parameterName] === undefined) {
            delete requestBody[parameterName];
          }
        });
        const response = await fetch(apiBaseUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody)
        });
        return await response.json();
      }

      // Pemanggilan Backend (same origin)
      async function callBackend(endpoint, method = "GET", body = null) {
        const config = {
          method: method,
          headers: { "Content-Type": "application/json" }
        };
        if (body !== null) {
          config.body = JSON.stringify(body);
        }
        const response = await fetch(endpoint, config);
        if (!response.ok) {
          // try to get error json
          let errorText = await response.text();
          try {
            const errorJson = JSON.parse(errorText);
            throw new Error(errorJson.detail || errorJson.message || errorText);
          } catch (_) {
            throw new Error(`HTTP ${response.status}: ${errorText}`);
          }
        }
        return await response.json();
      }

      function renderApiResult(outputElementId, responseData, errorMessage) {
        const outputElement = document.getElementById(outputElementId);
        outputElement.classList.remove("skeleton");
        outputElement.textContent = errorMessage ? "ERROR: " + errorMessage : JSON.stringify(responseData, null, 2);
      }

      function showLoadingState(outputElementId) {
        const outputElement = document.getElementById(outputElementId);
        outputElement.classList.add("skeleton");
        outputElement.textContent = "memuat...";
      }

      // Wiring semua form endpoint
      document.querySelectorAll("form[data-endpoint]").forEach(formElement => {
        formElement.addEventListener("submit", async submitEvent => {
          submitEvent.preventDefault();
          const methodName = formElement.dataset.endpoint;
          const outputElementId = formElement.dataset.out;
          const requestParameters = {};
          formElement.querySelectorAll("[name]").forEach(inputElement => {
            requestParameters[inputElement.name] = inputElement.value;
          });
          showLoadingState(outputElementId);
          try {
            let responseData;
            // Determine if endpoint is backend or casino
            const backendEndpoints = ["CreateUser", "ListUsers", "GetVendors", "GetVendorGames", "LaunchGame", "DeleteLaunchHistory"];
            if (backendEndpoints.includes(methodName)) {
              // Backend call
              switch (methodName) {
                case "CreateUser":
                  responseData = await callBackend("/users", "POST", { user_code: requestParameters.userCode });
                  break;
                case "ListUsers":
                  responseData = await callBackend("/users", "GET");
                  break;
                case "GetVendors":
                  responseData = await callBackend("/vendors", "GET");
                  break;
                case "GetVendorGames":
                  responseData = await callBackend(`/games?vendor=${requestParameters.vendorCode}`, "GET");
                  break;
                case "LaunchGame":
                  // 1. Ensure user exists (idempotent create)
                  await callBackend("/users", "POST", { user_code: requestParameters.userCode });
                  // 2. Call Casino API GetGameUrl
                  const casinoResponse = await callCasino("GetGameUrl", {
                    userCode: requestParameters.userCode,
                    vendorCode: requestParameters.vendorCode,
                    gameCode: requestParameters.gameCode
                  });
                  // 3. Store the full response in backend launch-history
                  responseData = await callBackend("/launch-history", "POST", {
                    user_code: requestParameters.userCode,
                    vendor_code: requestParameters.vendorCode,
                    game_code: requestParameters.gameCode,
                    response: casinoResponse
                  });
                  break;
                case "DeleteLaunchHistory":
                  responseData = await callBackend(`/launch-history/${requestParameters.id}`, "DELETE");
                  // For DELETE, we might want to return success message
                  if (responseData === null || (typeof responseData === 'object' && Object.keys(responseData).length === 0)) {
                    responseData = { status: "success", message: "Deleted" };
                  }
                  break;
                default:
                  throw new Error(`Unknown backend endpoint: ${methodName}`);
              }
            } else {
              // Casino API call
              responseData = await callCasino(methodName, requestParameters);
            }
            renderApiResult(outputElementId, responseData);
          } catch (error) {
            renderApiResult(outputElementId, null, error.message);
          }
        });
      });

      // Muat info agent buat header sidebar
      async function loadAgentInfo() {
        const agentCodeStatElement = document.getElementById("statAgentCode");
        const balanceStatElement = document.getElementById("statBalance");

        agentCodeStatElement.textContent = agentCode;
        balanceStatElement.classList.add("skeleton");
        balanceStatElement.textContent = "memuat...";

        try {
          const responseData = await callCasino("GetAgentInfo", {});

          if (responseData.balances) {
            const balanceValue = responseData.balances.IDR ?? Object.values(responseData.balances)[0];
            balanceStatElement.textContent = "IDR " + balanceValue;
          } else {
            balanceStatElement.textContent = responseData.msg || "Error";
          }
        } catch (error) {
          balanceStatElement.textContent = "Gagal konek";
        } finally {
          balanceStatElement.classList.remove("skeleton");
        }
      }

      // Auto-load pas halaman dibuka
      loadAgentInfo();
    </script>
  </body>
</html>
